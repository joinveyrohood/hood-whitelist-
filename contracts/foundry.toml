[profile.default]
src = "."
test = "forge-test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]
skip = ["hh-artifacts", "cache"]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
